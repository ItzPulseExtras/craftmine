mace:
  max-count: -1
  cooldown-seconds: 0
  enchantable: true
  whitelisted-enchants:
    - wind_burst
    - unbreaking
    - mending
  enchant-max-levels:
    density: 4
    breach: 4
    wind_burst: 2
    unbreaking: 3
    mending: 1

wielder:
  color: GOLD
  glow:
    enabled: true
  tab-list:
    enabled: true
  reveal:
    enabled: false
    interval-seconds: 300

announcements:
  mace-crafted:
    chat-enabled: true
  all-maces-crafted:
    chat-enabled: true
    title-enabled: true
  messages:
    all-maces-crafted: "<gold>Mace limit reached"
    mace-crafted: "<yellow>{player} crafted a mace. <gray>({count}/{limit})"
    cooldown-blocked: "<red>The mace is on cooldown for {seconds}s."
    enchant-blocked: "<red>That enchantment is not allowed on maces."
    position-reveal: "<gold>Mace wielder {player}: <yellow>{world} {x} {y} {z}"

update-checker:
  enabled: true
  message: "<gold>[Mace Config] <yellow>Version {latest} is available! <gray>You are running {current}. Download: https://modrinth.com/plugin/mace-config/versions"
